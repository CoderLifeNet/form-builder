name: Package Publish Preparation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Lockstep package version expected across publishable packages
        required: true
        default: 0.1.0-alpha.0
      publish:
        description: When true, publish to npm after successful validation and preparation
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:
  prepare-and-optionally-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate publishable package versions and internal dependency sync
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const releaseVersion = process.env.RELEASE_VERSION;
          const root = process.cwd();
          const packages = [
            ['@coderlifenet/form-core', 'packages/form-core/package.json', []],
            ['@coderlifenet/form-postgres', 'packages/form-postgres/package.json', ['@coderlifenet/form-core']],
            ['@coderlifenet/form-server', 'packages/form-server/package.json', ['@coderlifenet/form-core', '@coderlifenet/form-postgres']],
            ['@coderlifenet/form-react', 'packages/form-react/package.json', ['@coderlifenet/form-core']],
            ['@coderlifenet/form-builder', 'packages/form-builder/package.json', ['@coderlifenet/form-core']]
          ];

          const errors = [];
          for (const [name, relativePath, internalDeps] of packages) {
            const pkg = JSON.parse(fs.readFileSync(path.join(root, relativePath), 'utf8'));
            if (pkg.version !== releaseVersion) {
              errors.push(`${name} version ${pkg.version} does not match expected ${releaseVersion}`);
            }
            for (const depName of internalDeps) {
              const depVersion = pkg.dependencies?.[depName];
              if (depVersion !== releaseVersion) {
                errors.push(`${name} dependency ${depName}=${depVersion ?? 'missing'} does not match expected ${releaseVersion}`);
              }
            }
            const publishConfig = pkg.publishConfig ?? {};
            if (publishConfig.access !== 'public' || publishConfig.tag !== 'alpha') {
              errors.push(`${name} publishConfig must set access=public and tag=alpha`);
            }
          }

          const examplePackages = [
            'apps/example-minimal/package.json',
            'apps/example-workspace/package.json'
          ];
          for (const relativePath of examplePackages) {
            const pkg = JSON.parse(fs.readFileSync(path.join(root, relativePath), 'utf8'));
            if (pkg.private !== true) {
              errors.push(`${relativePath} must remain private=true`);
            }
            for (const depName of ['@coderlifenet/form-builder', '@coderlifenet/form-react']) {
              const depVersion = pkg.dependencies?.[depName];
              if (depVersion !== releaseVersion) {
                errors.push(`${relativePath} dependency ${depName}=${depVersion ?? 'missing'} must match ${releaseVersion}`);
              }
            }
          }

          const rootPkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          if (rootPkg.private !== true) {
            errors.push('Root package.json must remain private=true');
          }

          if (errors.length > 0) {
            for (const error of errors) {
              console.error(`ERROR: ${error}`);
            }
            process.exit(1);
          }
          console.log(`Validated lockstep package metadata for ${releaseVersion}.`);
          NODE

      - name: Validate source
        run: |
          npm run typecheck
          npm run build

      - name: Prepare release artifacts
        run: |
          npm run pack:artifacts
          npm run verify:consumer

      - name: Dry-run publish preparation (default)
        run: |
          for pkg in core postgres server react builder; do
            npm publish "tmp/packs/coderlifenet-form-${pkg}-${RELEASE_VERSION}.tgz" --access public --tag alpha --provenance --dry-run
          done

      - name: Publish to npm with trusted publishing and provenance
        if: ${{ inputs.publish }}
        run: |
          for pkg in core postgres server react builder; do
            npm publish "tmp/packs/coderlifenet-form-${pkg}-${RELEASE_VERSION}.tgz" --access public --tag alpha --provenance
          done
