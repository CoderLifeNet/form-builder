name: Publish Form Builder

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Lockstep package version expected across publishable packages
        required: true
        default: 0.1.0-alpha.0
      publish:
        description: When true, publish to npm after successful validation and preparation
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:
  prepare-and-optionally-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org

      - name: Set up npm for trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate form-builder release metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const releaseVersion = process.env.RELEASE_VERSION;
          const root = process.cwd();
          const errors = [];
          const publishPackage = JSON.parse(fs.readFileSync(path.join(root, 'packages/form-builder/package.json'), 'utf8'));
          if (publishPackage.version !== releaseVersion) {
            errors.push(`@coderlifenet/form-builder version ${publishPackage.version} does not match expected ${releaseVersion}`);
          }
          if (publishPackage.private !== false) {
            errors.push('@coderlifenet/form-builder must remain private=false for publication');
          }
          const publishConfig = publishPackage.publishConfig ?? {};
          if (publishConfig.access !== 'public' || publishConfig.tag !== 'alpha') {
            errors.push('@coderlifenet/form-builder publishConfig must set access=public and tag=alpha');
          }
          for (const dep of ['@coderlifenet/form-core', '@coderlifenet/form-postgres', '@coderlifenet/form-react', '@coderlifenet/form-server']) {
            if (publishPackage.dependencies?.[dep]) {
              errors.push(`@coderlifenet/form-builder must not depend on unpublished package ${dep}`);
            }
          }

          const examplePackages = [
            'apps/example-minimal/package.json',
            'apps/example-workspace/package.json'
          ];
          for (const relativePath of examplePackages) {
            const pkg = JSON.parse(fs.readFileSync(path.join(root, relativePath), 'utf8'));
            if (pkg.private !== true) {
              errors.push(`${relativePath} must remain private=true`);
            }
            for (const depName of ['@coderlifenet/form-builder']) {
              const depVersion = pkg.dependencies?.[depName];
              if (depVersion !== releaseVersion) {
                errors.push(`${relativePath} dependency ${depName}=${depVersion ?? 'missing'} must match ${releaseVersion}`);
              }
            }
          }

          const rootPkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          if (rootPkg.private !== true) {
            errors.push('Root package.json must remain private=true');
          }

          const internalOnlyPackages = [
            'packages/form-core/package.json',
            'packages/form-postgres/package.json',
            'packages/form-server/package.json',
            'packages/form-react/package.json'
          ];
          for (const relativePath of internalOnlyPackages) {
            const pkg = JSON.parse(fs.readFileSync(path.join(root, relativePath), 'utf8'));
            if (pkg.private !== true) {
              errors.push(`${relativePath} must remain private=true`);
            }
          }

          if (errors.length > 0) {
            for (const error of errors) {
              console.error(`ERROR: ${error}`);
            }
            process.exit(1);
          }
          console.log(`Validated single-package release metadata for ${releaseVersion}.`);
          NODE

      - name: Validate source
        run: |
          npm run build
          npm run typecheck

      - name: Prepare release artifacts
        run: |
          npm run pack:artifacts
          npm run verify:consumer

      - name: Dry-run publish preparation (default)
        run: |
          npm publish "tmp/packs/coderlifenet-form-builder-${RELEASE_VERSION}.tgz" --access public --tag alpha --provenance --dry-run

      - name: Publish to npm with trusted publishing and provenance
        if: ${{ inputs.publish }}
        run: |
          npm publish "tmp/packs/coderlifenet-form-builder-${RELEASE_VERSION}.tgz" --access public --tag alpha --provenance
